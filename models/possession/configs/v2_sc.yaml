# Possession model v2, no Metrica: v1 + ball model estimate as input + real-tracker gap profile
# from SkillCorner 1874553 tracking (MIT, no labels), selected on simulated-gap DFL validation AND
# real-gap SC-1874553. External games only; SkillCorner's other 19 matches stay held out.
name: possession_v2_sc
seed: 20261109

train_games: [DFL-J03WMX, DFL-J03WN1, DFL-J03WOH, DFL-J03WOY, DFL-J03WPY]
val_games: [DFL-J03WQQ, DFL-J03WR9]          # selection, ball hidden by the gap simulation
real_val_games: [SC-1874553]                 # selection, real tracker gaps, provider labels
ball_weights: release:ball_v1      # frozen ball model from inference/weights_manifest.json (sha256 checked)

# model
window: 200            # frames (8 s)
max_players: 32
d_model: 128
heads: 4
set_layers: 2
time_layers: 4
dropout: 0.1

# hidden ball: runs drawn from the real-tracker profile (SkillCorner 1874553 tracking, no labels),
# sometimes v1's synthetic gaps; never chosen from the labels
gap_mode: renewal
gap_profile: baseline/gap_profile.json
p_renewal: 0.8
gap_min: 1
gap_max: 500
miss_lo: 0.2
miss_hi: 0.6
p_blind: 0.15
p_hide_dead: 0.0       # no label-driven hiding: the model must not learn "no ball means D"
hide_dead_margin: 12   # frames hidden around such a run

# augmentation
p_flip_y: 0.5
p_swap: 0.5            # home <-> away, with x mirrored and H <-> A swapped
jitter_m: 0.1
p_drop_track: 0.05
p_drop_frame: 0.02

# optimisation
batch_size: 32
steps: 20000
warmup_steps: 1000
lr: 3.0e-4
weight_decay: 0.01
grad_clip: 1.0
change_weight: 1.0
bf16: true
num_workers: 8
ckpt_every: 500

# logging and evaluation
log_every: 200
eval_every: 2000
viterbi_penalty: 8.0   # fixed yardstick decoder for checkpoint choice only
